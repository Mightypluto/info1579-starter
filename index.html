<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>My Course Dashboard</h1>
    </header>

    <main>
        <section>
            <h2>Course Information</h2>
            <div id="dashboard"></div>
        </section>

        <section>
            <h2>All Course Modules</h2>
            <div id="allModulesList"></div>
        </section>

        <section>
            <h2>Remaining Modules</h2>
            <div id="remainingModulesList"></div>
        </section>

        <section>
            <h2>Random Joke</h2>
            <p id="joke"></p>
            <button id="jokeButton">Get Another Joke</button>
        </section>

        <section>
            <h2>Random Quote</h2>
            <p id="quote"></p>
            <button id="quoteButton">Get Another Quote</button>
        </section>
    </main>

</body>
</html>
